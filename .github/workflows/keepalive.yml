name: Keep Supabase awake
on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3 days — the project pauses after 7 idle days
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping platform-health
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            "https://jayflvpyrdvqhmftiokp.supabase.co/functions/v1/platform-health")
          cat /tmp/out
          test "$code" = "200"
