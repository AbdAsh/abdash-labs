<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PlaneMode — an AI that runs with the network off</title>
    <meta
      name="description"
      content="A small language model that downloads once and then runs entirely in your browser on WebGPU. No server, no account, no network."
    />
    <meta name="theme-color" content="#101014" />
    <!-- Root-relative on purpose: Vite prefixes `base` onto these at build,
         which yields /planemode/… Hard-coding the prefix here would double it. -->
<link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlaneMode" />
      <meta name="theme-color" content="#070f18" />
    <!-- Same two families abdash.net loads, requested identically so a visitor
         arriving from the portfolio hits a warm cache and sees no swap. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
